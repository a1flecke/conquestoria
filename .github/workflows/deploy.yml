name: CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  security-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          advanced-security: false
          inputs: .github/workflows
          version: v1.26.1

  desktop-change-check:
    runs-on: ubuntu-latest
    outputs:
      desktop_changed: ${{ steps.desktop-changes.outputs.desktop_changed }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for desktop build inputs
        id: desktop-changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' ]]; then
            echo "desktop_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            base_sha='${{ github.event.pull_request.base.sha }}'
          else
            base_sha='${{ github.event.before }}'
          fi

          if [[ "$base_sha" == '0000000000000000000000000000000000000000' ]]; then
            echo "desktop_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$base_sha" "${{ github.sha }}")"
          desktop_changed="$(printf '%s\n' "$changed_files" | node scripts/desktop-build-inputs.mjs)"
          echo "desktop_changed=$desktop_changed" >> "$GITHUB_OUTPUT"

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.13.1'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: node scripts/ci-record-phase-timing.mjs --output artifacts/ci-timing/web-build.json --phase web-build -- yarn build

      - name: Upload web build timing
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-timing-web-build
          path: artifacts/ci-timing/web-build.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  test-suite-shard-a:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.13.1'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Record test manifests
        run: |
          mkdir -p artifacts/test-manifests artifacts/vitest-results
          yarn test:manifest > artifacts/test-manifests/default.txt
          yarn test:manifest:ci:shard-a > artifacts/test-manifests/test-suite-shard-a.txt

      - name: Run test suite shard A
        run: node scripts/ci-record-phase-timing.mjs --output artifacts/ci-timing/test-suite-shard-a.json --phase test-suite-shard-a -- yarn test:ci:shard-a --report-json artifacts/vitest-results/test-suite-shard-a.json

      - name: Upload test suite shard A evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-suite-shard-a-evidence
          path: |
            artifacts/test-manifests
            artifacts/ci-timing
            artifacts/vitest-results
          if-no-files-found: warn
          retention-days: 14

  test-suite-shard-b:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.13.1'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Record test manifests
        run: |
          mkdir -p artifacts/test-manifests artifacts/vitest-results
          yarn test:manifest > artifacts/test-manifests/default.txt
          yarn test:manifest:ci:shard-b > artifacts/test-manifests/test-suite-shard-b.txt

      - name: Run test suite shard B
        run: node scripts/ci-record-phase-timing.mjs --output artifacts/ci-timing/test-suite-shard-b.json --phase test-suite-shard-b -- yarn test:ci:shard-b --report-json artifacts/vitest-results/test-suite-shard-b.json

      - name: Upload test suite shard B evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-suite-shard-b-evidence
          path: |
            artifacts/test-manifests
            artifacts/ci-timing
            artifacts/vitest-results
          if-no-files-found: warn
          retention-days: 14

  test-suite-shard-c:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.13.1'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Record test manifests
        run: |
          mkdir -p artifacts/test-manifests artifacts/vitest-results
          yarn test:manifest > artifacts/test-manifests/default.txt
          yarn test:manifest:ci:shard-c > artifacts/test-manifests/test-suite-shard-c.txt

      - name: Run test suite shard C
        run: node scripts/ci-record-phase-timing.mjs --output artifacts/ci-timing/test-suite-shard-c.json --phase test-suite-shard-c -- yarn test:ci:shard-c --report-json artifacts/vitest-results/test-suite-shard-c.json

      - name: Upload test suite shard C evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-suite-shard-c-evidence
          path: |
            artifacts/test-manifests
            artifacts/ci-timing
            artifacts/vitest-results
          if-no-files-found: warn
          retention-days: 14

  test-suite-shard-d:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.13.1'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Record test manifests
        run: |
          mkdir -p artifacts/test-manifests artifacts/vitest-results
          yarn test:manifest > artifacts/test-manifests/default.txt
          yarn test:manifest:ci:shard-d > artifacts/test-manifests/test-suite-shard-d.txt

      - name: Run test suite shard D
        run: node scripts/ci-record-phase-timing.mjs --output artifacts/ci-timing/test-suite-shard-d.json --phase test-suite-shard-d -- yarn test:ci:shard-d --report-json artifacts/vitest-results/test-suite-shard-d.json

      - name: Upload test suite shard D evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-suite-shard-d-evidence
          path: |
            artifacts/test-manifests
            artifacts/ci-timing
            artifacts/vitest-results
          if-no-files-found: warn
          retention-days: 14

  hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.13.1'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run hook tests
        run: node scripts/ci-record-phase-timing.mjs --output artifacts/ci-timing/hooks.json --phase hooks -- yarn test:hooks

      - name: Upload hook timing
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-timing-hooks
          path: artifacts/ci-timing/hooks.json
          if-no-files-found: warn
          retention-days: 14

  pirate-audio-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for pirate audio generator inputs
        id: pirate-audio-changes
        shell: bash
        run: |
          changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")"
          pirate_audio_changed=false

          while IFS= read -r file; do
            case "$file" in
              scripts/generate-pirate-sfx.sh|src/audio/pirate-audio-sources.ts|tests/audio/pirate-sfx-generator.test.ts|public/audio/sfx/pirates/*|public/audio/stinger/pirates/*|public/audio/sfx/naval-move-step.ogg|public/audio/sfx/galley-attack-swing.ogg|public/audio/sfx/galley-attack-impact.ogg|public/audio/sfx/trireme-attack-swing.ogg|public/audio/sfx/trireme-attack-impact.ogg|public/audio/sfx/catapult-siege-fire.ogg|public/audio/sfx/catapult-siege-impact.ogg|public/audio/sfx/ballista-siege-fire.ogg|public/audio/sfx/ballista-siege-impact.ogg|public/audio/sfx/carrack-death.ogg|public/audio/sfx/galleon-death.ogg|public/audio/sfx/steamship-death.ogg|public/audio/sfx/transport-death.ogg|public/audio/sfx/transport-load.ogg|public/audio/sfx/transport-unload.ogg|package.json|yarn.lock|.yarnrc.yml|.yarn/*|.github/workflows/deploy.yml)
                pirate_audio_changed=true
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "pirate_audio_changed=$pirate_audio_changed" >> "$GITHUB_OUTPUT"

      - name: Enable Corepack
        if: steps.pirate-audio-changes.outputs.pirate_audio_changed == 'true'
        run: corepack enable

      - name: Setup Node
        if: steps.pirate-audio-changes.outputs.pirate_audio_changed == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.13.1'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        if: steps.pirate-audio-changes.outputs.pirate_audio_changed == 'true'
        run: yarn install --immutable

      - name: Install audio test tooling
        if: steps.pirate-audio-changes.outputs.pirate_audio_changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify pirate audio generation and determinism
        if: steps.pirate-audio-changes.outputs.pirate_audio_changed == 'true'
        run: RUN_PIRATE_SFX_DETERMINISM=1 yarn vitest run tests/audio/pirate-sfx-generator.test.ts

      - name: Report skipped deterministic audio check
        if: steps.pirate-audio-changes.outputs.pirate_audio_changed != 'true'
        run: echo "No pirate audio generator inputs changed; deterministic generation check skipped."

  web-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.13.1'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Cache Playwright browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('yarn.lock') }}

      - name: Install Playwright browser
        run: yarn playwright install --with-deps chromium

      - name: Run web smoke test
        run: yarn test:web-smoke

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-evidence
          path: |
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 14

  tauri-frontend-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.13.1'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Tauri frontend
        run: yarn build:tauri

  tauri-macos-build:
    runs-on: macos-latest
    needs: desktop-change-check
    if: needs.desktop-change-check.outputs.desktop_changed == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.13.1'

      - name: Setup Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Configure ad-hoc signing
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build macOS app
        run: yarn tauri:build:mac-app

      - name: Check macOS artifacts
        run: yarn tauri:check:mac-artifacts

      - name: Verify ad-hoc signed macOS app
        run: codesign --verify --deep --strict --verbose=2 src-tauri/target/release/bundle/macos/Conquestoria.app

      - name: Upload macOS artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conquestoria-macos
          path: src-tauri/target/release/bundle/macos/Conquestoria.app

  merge-gate:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - web-build
      - test-suite-shard-a
      - test-suite-shard-b
      - test-suite-shard-c
      - test-suite-shard-d
      - hooks
      - web-smoke
      - security-analysis
      - desktop-change-check
      - tauri-frontend-build
      - tauri-macos-build
      - pirate-audio-reproducibility
    env:
      GATE_NEEDS_JSON: ${{ toJSON(needs) }}
      GATE_EVENT_NAME: ${{ github.event_name }}
      GATE_REF: ${{ github.ref }}
      GATE_DESKTOP_CHANGED: ${{ needs.desktop-change-check.outputs.desktop_changed }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Verify required child results
        run: node scripts/verify-merge-gate.mjs

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [merge-gate]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
