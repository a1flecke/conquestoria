    <script>
      const { beast_handler: beastHandler, war_elephant: warElephant, cuirassier } = globalThis.__ISSUE_708_SPRITES__;

      const units = [
        ['beast_handler', 'Beast Handler', beastHandler, 'Two-footed handler, hand-held forked staff, leash, and four-legged hound.'],
        ['war_elephant', 'War Elephant', warElephant, 'Four-footed elephant, separate ear and trunk, crewed howdah, rail-mounted standard.'],
        ['cuirassier', 'Cuirassier', cuirassier, 'Horse gait, downward tail, forward-straddling rider, reins, sabre, and impact spark.'],
      ];
      const grid = document.querySelector('#sprite-grid');
      const buttons = [...document.querySelectorAll('button[data-state]')];
      const factionSelect = document.querySelector('#faction-select');
      const reducedMotion = document.querySelector('#reduced-motion');
      let currentState = 'idle';

      function setState(state) {
        currentState = state;
        for (const button of buttons) button.setAttribute('aria-pressed', String(button.dataset.state === state));
        for (const sprite of grid.querySelectorAll('.cq-sprite-wrap, .cq-sprite-wrap svg')) sprite.dataset.state = state;
      }

      function renderFaction(faction) {
        const cards = [];
        for (const [unit, name, sprites, description] of units) {
          const card = document.createElement('article');
          card.className = 'card';
          card.dataset.unit = unit;
          const heading = document.createElement('h2');
          heading.textContent = name;
          const stage = document.createElement('div');
          stage.className = 'sprite-stage';
          const template = document.createElement('template');
          template.innerHTML = sprites[faction];
          stage.append(template.content);
          const note = document.createElement('p');
          note.textContent = description;
          card.append(heading, stage, note);
          cards.push(card);
        }
        grid.replaceChildren(...cards);
        setState(currentState);
      }

      for (const button of buttons) button.addEventListener('click', () => setState(button.dataset.state));
      factionSelect.addEventListener('change', () => renderFaction(factionSelect.value));
      reducedMotion.addEventListener('change', () => {
        document.documentElement.dataset.reducedMotion = String(reducedMotion.checked);
        grid.dataset.reducedMotion = String(reducedMotion.checked);
      });
      renderFaction(factionSelect.value);
    </script>
  </body>
